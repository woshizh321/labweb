# Nginx reverse proxy for the lab website.
# Routing:
#   /        -> frontend (Next.js)  :3000
#   /api/    -> backend  (FastAPI)  :8000
#   /apps/   -> reserved for future Streamlit / Gradio model services
#
# HTTPS is intentionally NOT configured in Phase-1. Add a TLS server block
# (certbot / Let's Encrypt) once a domain is pointed at the server.

upstream frontend_upstream {
    server frontend:3000;
}

upstream backend_upstream {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # Reasonable upload cap; no patient data is processed here.
    client_max_body_size 5m;

    # Compression for text-like assets (HTML/JS/CSS/JSON/SVG).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        image/svg+xml;

    # Backend health probe (FastAPI exposes /health, not /api/health).
    # Exposed explicitly so monitoring / curl can reach it through nginx.
    location = /health {
        proxy_pass http://backend_upstream/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # Backend API
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Model WebApps under /apps/ are static bundles vendored into the frontend
    # (frontend/public/apps/<id>/), so they are served by the frontend container
    # via the catch-all below — e.g. PLAN-C at /apps/plan-c/. Heavy services
    # (Streamlit / Gradio) can later be added here as their own upstream blocks.

    # Frontend (catch-all)
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
